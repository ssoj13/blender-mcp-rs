[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "blender_mcp"
version = "0.1.0"
description = "MCP server for Blender 3D as Python extension"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your@email.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Rust",
]

[tool.maturin]
# extension-module + abi3-py39 must match Cargo.toml pyo3 features (PEP 384, one wheel for CPython 3.9+).
features = ["pyo3/extension-module", "pyo3/abi3-py39"]
module-name = "blender_mcp"
py-limited-api = "cp39"
